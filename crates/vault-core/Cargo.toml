[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
description = "Kerosene vault core — Clean Architecture library crate"
license = "UNLICENSED"
publish = false

[features]
default = ["production"]
# Kept only so old build commands fail with an explicit security error.
dealer_lab = ["vault-bootstrap/dealer_lab", "vault-api/dealer_lab"]
production = ["vault-bootstrap/production", "vault-api/production"]
hybrid = ["vault-bootstrap/hybrid", "vault-api/hybrid"]
tee_hw = ["vault-bootstrap/tee_hw", "vault-api/tee_hw"]
tpm = ["vault-bootstrap/tpm", "vault-api/tpm"]

[lib]
path = "src/lib.rs"

[dependencies]
vault-adapters = { path = "../vault-adapters", default-features = false }
vault-api = { path = "../vault-api", default-features = false }
vault-application = { path = "../vault-application" }
vault-bootstrap = { path = "../vault-bootstrap", default-features = false }
vault-domain = { path = "../vault-domain" }
