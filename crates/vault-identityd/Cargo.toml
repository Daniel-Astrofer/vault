[package]
name = "vault-identityd"
version = "0.1.0"
edition = "2021"
description = "Kerosene vault identity daemon — Ed25519 + ML-DSA-65, SPIFFE SVID, mTLS"
license = "UNLICENSED"
publish = false

[[bin]]
name = "vault-identityd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
vault-identity-core = { path = "../vault-identity-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
libc = "0.2"
